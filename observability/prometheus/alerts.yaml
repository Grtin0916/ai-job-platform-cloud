groups:
  - name: media-task-platform-java.local-slo
    interval: 30s
    rules:
      - alert: JavaAppTargetDown
        expr: up{job=~".*java.*|.*media.*"} == 0
        for: 2m
        labels:
          severity: warning
          scope: local
          service: media-task-platform-java
        annotations:
          summary: "Java app Prometheus target is down in local dev"
          description: "The local Prometheus target for media-task-platform-java has been down for more than 2 minutes. This is a local Docker Desktop + kind draft alert, not a production page."

      - alert: JavaAppHighErrorRatio
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          scope: local
          service: media-task-platform-java
        annotations:
          summary: "Java app high 5xx ratio in local dev"
          description: "More than 5% of observed HTTP requests are 5xx over the last 5 minutes. Metric labels must be verified against the actual Spring Boot Actuator Prometheus output."

      - alert: JavaAppHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
          scope: local
          service: media-task-platform-java
        annotations:
          summary: "Java app high p95 latency in local dev"
          description: "p95 HTTP request latency is above 1 second for 5 minutes. This is a local SLO draft and depends on verified histogram metrics."
