global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/week18-lifecycle-alerts.yml

scrape_configs:
  - job_name: week18-java-lifecycle-live
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:18081
        labels:
          source: java-actuator
          scope: local-live